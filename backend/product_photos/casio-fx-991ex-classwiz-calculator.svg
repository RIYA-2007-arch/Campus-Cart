<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <filter id="shadowEX" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <pattern id="carbonEX" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#18181b"/>
      <rect x="3" width="3" height="3" fill="#27272a"/>
      <rect y="3" width="3" height="3" fill="#27272a"/>
      <rect x="3" y="3" width="3" height="3" fill="#18181b"/>
    </pattern>
    <linearGradient id="bodyGradEX" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="metalRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="solarEX" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Pure White Background -->
  <rect width="600" height="600" fill="#ffffff"/>

  <!-- Calculator Body -->
  <g filter="url(#shadowEX)">
    <!-- Base Chassis Rim -->
    <rect x="157" y="32" width="286" height="536" rx="28" fill="#000000"/>
    <!-- Carbon Fiber Textured Faceplate -->
    <rect x="160" y="35" width="280" height="530" rx="26" fill="url(#bodyGradEX)"/>
    <rect x="160" y="35" width="280" height="530" rx="26" fill="url(#carbonEX)" opacity="0.45"/>
    <rect x="164" y="39" width="272" height="522" rx="23" fill="none" stroke="#52525b" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Header Section -->
  <text x="188" y="66" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="1.2">CASIO</text>
  <text x="188" y="82" font-family="'Times New Roman', Georgia, serif" font-size="14" font-style="italic" font-weight="bold" fill="#38bdf8">ClassWiz</text>
  <text x="252" y="82" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">fx-991EX</text>
  <text x="188" y="93" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#a1a1aa" letter-spacing="0.5">552 FUNCTIONS • HIGH RESOLUTION</text>

  <!-- Solar Cell Panel -->
  <g transform="translate(355, 52)">
    <rect width="58" height="23" rx="2" fill="url(#solarEX)" stroke="#3f3f46" stroke-width="1"/>
    <line x1="14" y1="0" x2="14" y2="23" stroke="#6b21a8" stroke-width="0.8"/>
    <line x1="29" y1="0" x2="29" y2="23" stroke="#6b21a8" stroke-width="0.8"/>
    <line x1="43" y1="0" x2="43" y2="23" stroke="#6b21a8" stroke-width="0.8"/>
    <text x="29" y="33" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#71717a" text-anchor="middle">TWO WAY POWER</text>
  </g>

  <!-- High-Res Dot Matrix Screen (Famous ClassWiz Display) -->
  <g transform="translate(180, 100)">
    <rect width="240" height="90" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
    <!-- Paper-White High Res LCD Glass -->
    <rect x="7" y="7" width="226" height="76" rx="3" fill="#e2e8f0"/>
    <polygon points="7,7 130,7 80,83 7,83" fill="#ffffff" opacity="0.25"/>

    <!-- High Res Icons Header -->
    <rect x="7" y="7" width="226" height="14" fill="#cbd5e1" opacity="0.6"/>
    <text x="12" y="17" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#0f172a">[1:Calculate]  [2:Complex]  [4:Matrix]  D</text>

    <!-- Crisp High Res Math Equation -->
    <text x="14" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#09090b">f(x) = 2x³ - 5x² + 4</text>
    <!-- Result Line -->
    <text x="14" y="62" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">x₁ = 2,  x₂ = 0.5</text>
    <text x="220" y="77" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#09090b" text-anchor="end">4.</text>
  </g>

  <!-- Modern Circular Replay Cursor Ring -->
  <g transform="translate(300, 222)">
    <circle r="25" fill="#18181b" stroke="url(#metalRing)" stroke-width="2.5"/>
    <circle r="12" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <!-- Direction Arrows -->
    <polygon points="0,-20 -3.5,-16 3.5,-16" fill="#38bdf8"/>
    <polygon points="0,20 -3.5,16 3.5,16" fill="#38bdf8"/>
    <polygon points="-20,0 -16,-3.5 -16,3.5" fill="#38bdf8"/>
    <polygon points="20,0 16,-3.5 16,3.5" fill="#38bdf8"/>
  </g>

  <!-- Top Function Keys -->
  <rect x="180" y="200" width="30" height="18" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="195" y="196" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#facc15" text-anchor="middle">SHIFT</text>
  <rect x="220" y="200" width="30" height="18" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="235" y="196" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#f87171" text-anchor="middle">OPTN</text>
  <rect x="350" y="200" width="30" height="18" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="365" y="196" font-family="Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#38bdf8" text-anchor="middle">MENU</text>
  <rect x="390" y="200" width="30" height="18" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="405" y="196" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">ON</text>

  <!-- Science Rows (ClassWiz style) -->
  <g fill="#27272a" stroke="#3f3f46" stroke-width="1" font-family="Arial, sans-serif" font-size="8" font-weight="bold">
    <rect x="180" y="228" width="24" height="15" rx="3"/><text x="192" y="239" fill="#e4e4e7" text-anchor="middle">QR</text>
    <rect x="210" y="228" width="24" height="15" rx="3"/><text x="222" y="239" fill="#e4e4e7" text-anchor="middle">CALC</text>
    <rect x="366" y="228" width="24" height="15" rx="3"/><text x="378" y="239" fill="#e4e4e7" text-anchor="middle">x⁻¹</text>
    <rect x="396" y="228" width="24" height="15" rx="3"/><text x="408" y="239" fill="#e4e4e7" text-anchor="middle">log</text>

    <!-- Row 2 -->
    <rect x="180" y="252" width="34" height="16" rx="3"/><text x="197" y="263" fill="#e4e4e7" text-anchor="middle">■/□</text>
    <rect x="222" y="252" width="34" height="16" rx="3"/><text x="239" y="263" fill="#e4e4e7" text-anchor="middle">√■</text>
    <rect x="264" y="252" width="34" height="16" rx="3"/><text x="281" y="263" fill="#e4e4e7" text-anchor="middle">x²</text>
    <rect x="306" y="252" width="34" height="16" rx="3"/><text x="323" y="263" fill="#e4e4e7" text-anchor="middle">x■</text>
    <rect x="348" y="252" width="34" height="16" rx="3"/><text x="365" y="263" fill="#e4e4e7" text-anchor="middle">log</text>
    <rect x="390" y="252" width="34" height="16" rx="3"/><text x="407" y="263" fill="#e4e4e7" text-anchor="middle">ln</text>

    <!-- Row 3 -->
    <rect x="180" y="276" width="34" height="16" rx="3"/><text x="197" y="287" fill="#e4e4e7" text-anchor="middle">(-)</text>
    <rect x="222" y="276" width="34" height="16" rx="3"/><text x="239" y="287" fill="#e4e4e7" text-anchor="middle">°' ''</text>
    <rect x="264" y="276" width="34" height="16" rx="3"/><text x="281" y="287" fill="#e4e4e7" text-anchor="middle">x</text>
    <rect x="306" y="276" width="34" height="16" rx="3"/><text x="323" y="287" fill="#e4e4e7" text-anchor="middle">sin</text>
    <rect x="348" y="276" width="34" height="16" rx="3"/><text x="365" y="287" fill="#e4e4e7" text-anchor="middle">cos</text>
    <rect x="390" y="276" width="34" height="16" rx="3"/><text x="407" y="287" fill="#e4e4e7" text-anchor="middle">tan</text>

    <!-- Row 4 -->
    <rect x="180" y="300" width="34" height="16" rx="3"/><text x="197" y="311" fill="#e4e4e7" text-anchor="middle">STO</text>
    <rect x="222" y="300" width="34" height="16" rx="3"/><text x="239" y="311" fill="#e4e4e7" text-anchor="middle">ENG</text>
    <rect x="264" y="300" width="34" height="16" rx="3"/><text x="281" y="311" fill="#e4e4e7" text-anchor="middle">(</text>
    <rect x="306" y="300" width="34" height="16" rx="3"/><text x="323" y="311" fill="#e4e4e7" text-anchor="middle">)</text>
    <rect x="348" y="300" width="34" height="16" rx="3"/><text x="365" y="311" font-size="7" fill="#e4e4e7" text-anchor="middle">S⇔D</text>
    <rect x="390" y="300" width="34" height="16" rx="3"/><text x="407" y="311" fill="#e4e4e7" text-anchor="middle">M+</text>
  </g>

  <!-- Modern White Numbers on Dark Face -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <!-- Row 1 -->
    <rect x="180" y="335" width="42" height="34" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/><text x="201" y="357" font-size="16" fill="#ffffff" text-anchor="middle">7</text>
    <rect x="230" y="335" width="42" height="34" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/><text x="251" y="357" font-size="16" fill="#ffffff" text-anchor="middle">8</text>
    <rect x="280" y="335" width="42" height="34" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/><text x="301" y="357" font-size="16" fill="#ffffff" text-anchor="middle">9</text>
    <rect x="330" y="335" width="42" height="34" rx="5" fill="#27272a" stroke="#d97706" stroke-width="1.5"/><text x="351" y="356" font-size="12" fill="#fbbf24" text-anchor="middle">DEL</text>
    <rect x="380" y="335" width="42" height="34" rx="5" fill="#27272a" stroke="#ef4444" stroke-width="1.5"/><text x="401" y="356" font-size="12" fill="#f87171" text-anchor="middle">AC</text>

    <!-- Row 2 -->
    <rect x="180" y="380" width="42" height="34" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/><text x="201" y="402" font-size="16" fill="#ffffff" text-anchor="middle">4</text>
    <rect x="230" y="380" width="42" height="34" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/><text x="251" y="402" font-size="16" fill="#ffffff" text-anchor="middle">5</text>
    <rect x="280" y="380" width="42" height="34" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/><text x="301" y="402" font-size="16" fill="#ffffff" text-anchor="middle">6</text>
    <rect x="330" y="380" width="42" height="34" rx="5" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/><text x="351" y="402" font-size="17" fill="#ffffff" text-anchor="middle">×</text>
    <rect x="380" y="380" width="42" height="34" rx="5" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/><text x="401" y="402" font-size="17" fill="#ffffff" text-anchor="middle">÷</text>

    <!-- Row 3 -->
    <rect x="180" y="425" width="42" height="34" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/><text x="201" y="447" font-size="16" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="230" y="425" width="42" height="34" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/><text x="251" y="447" font-size="16" fill="#ffffff" text-anchor="middle">2</text>
    <rect x="280" y="425" width="42" height="34" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/><text x="301" y="447" font-size="16" fill="#ffffff" text-anchor="middle">3</text>
    <rect x="330" y="425" width="42" height="34" rx="5" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/><text x="351" y="447" font-size="17" fill="#ffffff" text-anchor="middle">+</text>
    <rect x="380" y="425" width="42" height="34" rx="5" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/><text x="401" y="447" font-size="17" fill="#ffffff" text-anchor="middle">-</text>

    <!-- Row 4 -->
    <rect x="180" y="470" width="42" height="34" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/><text x="201" y="492" font-size="16" fill="#ffffff" text-anchor="middle">0</text>
    <rect x="230" y="470" width="42" height="34" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/><text x="251" y="492" font-size="18" fill="#ffffff" text-anchor="middle">•</text>
    <rect x="280" y="470" width="42" height="34" rx="5" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/><text x="301" y="491" font-size="11" fill="#38bdf8" text-anchor="middle">×10ˣ</text>
    <rect x="330" y="470" width="42" height="34" rx="5" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/><text x="351" y="491" font-size="11" fill="#ffffff" text-anchor="middle">Ans</text>
    <rect x="380" y="470" width="42" height="34" rx="5" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/><text x="401" y="493" font-size="18" fill="#ffffff" text-anchor="middle">=</text>
  </g>
</svg>