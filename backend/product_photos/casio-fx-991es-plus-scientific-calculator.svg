<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="bodyGrad991" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="replayGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="solarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#271002"/>
    </linearGradient>
  </defs>

  <!-- Pure White Background -->
  <rect width="600" height="600" fill="#ffffff"/>

  <!-- Calculator Body with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Dark Slider Edge Rim -->
    <rect x="157" y="32" width="286" height="536" rx="30" fill="#334155"/>
    <!-- Main Silver Casing -->
    <rect x="160" y="35" width="280" height="530" rx="28" fill="url(#bodyGrad991)"/>
    <!-- Subtle Inner Bevel Line -->
    <rect x="164" y="39" width="272" height="522" rx="25" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- Header Branding -->
  <text x="190" y="65" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="900" fill="#0f172a" letter-spacing="1">CASIO</text>
  <text x="190" y="80" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">fx-991ES PLUS</text>
  <text x="190" y="91" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" fill="#1e40af">NATURAL-V.P.A.M.</text>

  <!-- Solar Cell Panel -->
  <g transform="translate(355, 52)">
    <rect width="58" height="24" rx="3" fill="url(#solarGrad)" stroke="#1e293b" stroke-width="1"/>
    <!-- Solar grid lines -->
    <line x1="14" y1="0" x2="14" y2="24" stroke="#92400e" stroke-width="0.75"/>
    <line x1="29" y1="0" x2="29" y2="24" stroke="#92400e" stroke-width="0.75"/>
    <line x1="43" y1="0" x2="43" y2="24" stroke="#92400e" stroke-width="0.75"/>
    <text x="29" y="34" font-family="Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#64748b" text-anchor="middle">TWO WAY POWER</text>
  </g>

  <!-- LCD Screen Bezel & Display -->
  <g transform="translate(180, 100)">
    <!-- Screen Frame -->
    <rect width="240" height="88" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="2" y="2" width="236" height="84" rx="7" fill="none" stroke="#475569" stroke-width="1" opacity="0.6"/>
    <!-- LCD Glass -->
    <rect x="8" y="8" width="224" height="72" rx="4" fill="#a4baa6"/>
    <!-- Glass Reflection Highlight -->
    <polygon points="8,8 140,8 90,80 8,80" fill="#ffffff" opacity="0.12"/>

    <!-- Screen Content -->
    <!-- Top Status Indicators -->
    <text x="14" y="20" font-family="monospace" font-size="8" font-weight="bold" fill="#1e293b">D   Math   ▲▼</text>
    <!-- Math Formula -->
    <text x="14" y="44" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#0f172a">∫(0→π) sin(x) dx</text>
    <!-- Result Value -->
    <text x="218" y="70" font-family="'Courier New', monospace" font-size="20" font-weight="900" fill="#0f172a" text-anchor="end">2.</text>
  </g>

  <!-- Navigation / Replay Cursor Area -->
  <g transform="translate(300, 222)">
    <!-- REPLAY Circle Button -->
    <circle r="26" fill="url(#replayGrad)" stroke="#64748b" stroke-width="1.5"/>
    <circle r="14" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="3" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#475569" text-anchor="middle">REPLAY</text>
    <!-- Direction Arrows -->
    <polygon points="0,-22 -4,-17 4,-17" fill="#334155"/>
    <polygon points="0,22 -4,17 4,17" fill="#334155"/>
    <polygon points="-22,0 -17,-4 -17,4" fill="#334155"/>
    <polygon points="22,0 17,-4 17,4" fill="#334155"/>
  </g>

  <!-- Top Function Buttons (Shift, Alpha, Mode, On) -->
  <!-- SHIFT -->
  <rect x="180" y="200" width="30" height="18" rx="5" fill="#475569" stroke="#334155" stroke-width="1"/>
  <text x="195" y="196" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#eab308" text-anchor="middle">SHIFT</text>
  <!-- ALPHA -->
  <rect x="220" y="200" width="30" height="18" rx="5" fill="#475569" stroke="#334155" stroke-width="1"/>
  <text x="235" y="196" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#ef4444" text-anchor="middle">ALPHA</text>
  <!-- MODE SETUP -->
  <rect x="350" y="200" width="30" height="18" rx="5" fill="#475569" stroke="#334155" stroke-width="1"/>
  <text x="365" y="196" font-family="Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#334155" text-anchor="middle">MODE</text>
  <!-- ON -->
  <rect x="390" y="200" width="30" height="18" rx="5" fill="#475569" stroke="#334155" stroke-width="1"/>
  <text x="405" y="196" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#334155" text-anchor="middle">ON</text>

  <!-- Scientific Function Buttons Rows -->
  <!-- Row 1: CALC, ∫dx, x⁻¹, log -->
  <g fill="#334155" stroke="#1e293b" stroke-width="1" font-family="Arial, sans-serif" font-size="8" font-weight="bold">
    <rect x="180" y="228" width="24" height="15" rx="4"/><text x="192" y="239" fill="#ffffff" text-anchor="middle">CALC</text>
    <rect x="210" y="228" width="24" height="15" rx="4"/><text x="222" y="239" fill="#ffffff" text-anchor="middle">∫dx</text>
    <rect x="366" y="228" width="24" height="15" rx="4"/><text x="378" y="239" fill="#ffffff" text-anchor="middle">x⁻¹</text>
    <rect x="396" y="228" width="24" height="15" rx="4"/><text x="408" y="239" fill="#ffffff" text-anchor="middle">log</text>

    <!-- Row 2: frac, sqrt, x², x^, log_a, ln -->
    <rect x="180" y="252" width="34" height="16" rx="4"/><text x="197" y="263" fill="#ffffff" text-anchor="middle">■/□</text>
    <rect x="222" y="252" width="34" height="16" rx="4"/><text x="239" y="263" fill="#ffffff" text-anchor="middle">√■</text>
    <rect x="264" y="252" width="34" height="16" rx="4"/><text x="281" y="263" fill="#ffffff" text-anchor="middle">x²</text>
    <rect x="306" y="252" width="34" height="16" rx="4"/><text x="323" y="263" fill="#ffffff" text-anchor="middle">x■</text>
    <rect x="348" y="252" width="34" height="16" rx="4"/><text x="365" y="263" fill="#ffffff" text-anchor="middle">log</text>
    <rect x="390" y="252" width="34" height="16" rx="4"/><text x="407" y="263" fill="#ffffff" text-anchor="middle">ln</text>

    <!-- Row 3: (-), °, hyp, sin, cos, tan -->
    <rect x="180" y="276" width="34" height="16" rx="4"/><text x="197" y="287" fill="#ffffff" text-anchor="middle">(-)</text>
    <rect x="222" y="276" width="34" height="16" rx="4"/><text x="239" y="287" fill="#ffffff" text-anchor="middle">°' ''</text>
    <rect x="264" y="276" width="34" height="16" rx="4"/><text x="281" y="287" fill="#ffffff" text-anchor="middle">hyp</text>
    <rect x="306" y="276" width="34" height="16" rx="4"/><text x="323" y="287" fill="#ffffff" text-anchor="middle">sin</text>
    <rect x="348" y="276" width="34" height="16" rx="4"/><text x="365" y="287" fill="#ffffff" text-anchor="middle">cos</text>
    <rect x="390" y="276" width="34" height="16" rx="4"/><text x="407" y="287" fill="#ffffff" text-anchor="middle">tan</text>

    <!-- Row 4: STO, ENG, (, ), S<=>D, M+ -->
    <rect x="180" y="300" width="34" height="16" rx="4"/><text x="197" y="311" fill="#ffffff" text-anchor="middle">RCL</text>
    <rect x="222" y="300" width="34" height="16" rx="4"/><text x="239" y="311" fill="#ffffff" text-anchor="middle">ENG</text>
    <rect x="264" y="300" width="34" height="16" rx="4"/><text x="281" y="311" fill="#ffffff" text-anchor="middle">(</text>
    <rect x="306" y="300" width="34" height="16" rx="4"/><text x="323" y="311" fill="#ffffff" text-anchor="middle">)</text>
    <rect x="348" y="300" width="34" height="16" rx="4"/><text x="365" y="311" fill="#ffffff" font-size="7" text-anchor="middle">S⇔D</text>
    <rect x="390" y="300" width="34" height="16" rx="4"/><text x="407" y="311" fill="#ffffff" text-anchor="middle">M+</text>
  </g>

  <!-- Numeric Keypad (7-8-9-DEL-AC, etc.) -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <!-- Row 1: 7, 8, 9, DEL, AC -->
    <rect x="180" y="335" width="42" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="201" y="357" font-size="16" fill="#0f172a" text-anchor="middle">7</text>
    <rect x="230" y="335" width="42" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="251" y="357" font-size="16" fill="#0f172a" text-anchor="middle">8</text>
    <rect x="280" y="335" width="42" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="301" y="357" font-size="16" fill="#0f172a" text-anchor="middle">9</text>
    <rect x="330" y="335" width="42" height="34" rx="6" fill="#d97706" stroke="#b45309" stroke-width="1.5"/><text x="351" y="356" font-size="12" fill="#ffffff" text-anchor="middle">DEL</text>
    <rect x="380" y="335" width="42" height="34" rx="6" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/><text x="401" y="356" font-size="12" fill="#ffffff" text-anchor="middle">AC</text>

    <!-- Row 2: 4, 5, 6, ×, ÷ -->
    <rect x="180" y="380" width="42" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="201" y="402" font-size="16" fill="#0f172a" text-anchor="middle">4</text>
    <rect x="230" y="380" width="42" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="251" y="402" font-size="16" fill="#0f172a" text-anchor="middle">5</text>
    <rect x="280" y="380" width="42" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="301" y="402" font-size="16" fill="#0f172a" text-anchor="middle">6</text>
    <rect x="330" y="380" width="42" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="351" y="402" font-size="17" fill="#0f172a" text-anchor="middle">×</text>
    <rect x="380" y="380" width="42" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="401" y="402" font-size="17" fill="#0f172a" text-anchor="middle">÷</text>

    <!-- Row 3: 1, 2, 3, +, - -->
    <rect x="180" y="425" width="42" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="201" y="447" font-size="16" fill="#0f172a" text-anchor="middle">1</text>
    <rect x="230" y="425" width="42" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="251" y="447" font-size="16" fill="#0f172a" text-anchor="middle">2</text>
    <rect x="280" y="425" width="42" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="301" y="447" font-size="16" fill="#0f172a" text-anchor="middle">3</text>
    <rect x="330" y="425" width="42" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="351" y="447" font-size="17" fill="#0f172a" text-anchor="middle">+</text>
    <rect x="380" y="425" width="42" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="401" y="447" font-size="17" fill="#0f172a" text-anchor="middle">-</text>

    <!-- Row 4: 0, ., x10^x, Ans, = -->
    <rect x="180" y="470" width="42" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="201" y="492" font-size="16" fill="#0f172a" text-anchor="middle">0</text>
    <rect x="230" y="470" width="42" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="251" y="492" font-size="18" fill="#0f172a" text-anchor="middle">•</text>
    <rect x="280" y="470" width="42" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="301" y="491" font-size="11" fill="#0f172a" text-anchor="middle">×10ˣ</text>
    <rect x="330" y="470" width="42" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="351" y="491" font-size="11" fill="#0f172a" text-anchor="middle">Ans</text>
    <rect x="380" y="470" width="42" height="34" rx="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/><text x="401" y="493" font-size="18" fill="#0f172a" text-anchor="middle">=</text>
  </g>

  <!-- Bottom Accent Tag -->
  <text x="300" y="535" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#64748b" text-anchor="middle">CASIO COMPUTER CO., LTD.</text>
</svg>