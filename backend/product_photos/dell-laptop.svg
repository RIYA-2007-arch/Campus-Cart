<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="chassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#bg)"/>

  <!-- Laptop Display Lid -->
  <g filter="url(#shadow)" transform="translate(110, 60)">
    <rect x="0" y="0" width="380" height="235" rx="10" fill="url(#chassis)" stroke="#64748b" stroke-width="2"/>
    <rect x="12" y="12" width="356" height="211" rx="4" fill="url(#screen)"/>
    <!-- Dell Bloom Wallpaper -->
    <circle cx="190" cy="117" r="70" fill="rgba(56, 189, 248, 0.35)"/>
    <circle cx="190" cy="117" r="45" fill="rgba(255, 255, 255, 0.45)"/>
    <!-- Windows 11 Taskbar -->
    <rect x="12" y="210" width="356" height="13" fill="rgba(15, 23, 42, 0.7)"/>
    <circle cx="180" cy="216" r="3" fill="#38bdf8"/>
    <circle cx="190" cy="216" r="3" fill="#38bdf8"/>
    <circle cx="200" cy="216" r="3" fill="#38bdf8"/>
    <!-- Webcam -->
    <circle cx="190" cy="6" r="2.5" fill="#0f172a"/>
    <!-- DELL Logo on chin -->
    <circle cx="190" cy="229" r="5" fill="#64748b"/>
    <text x="190" y="232" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="6" font-weight="900" text-anchor="middle">DELL</text>
  </g>

  <!-- Laptop Keyboard Base -->
  <g filter="url(#shadow)" transform="translate(60, 285)">
    <polygon points="50,0 330,0 380,65 0,65" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
    <polygon points="52,2 328,2 376,63 4,63" fill="url(#chassis)"/>
    <polygon points="70,6 310,6 335,40 45,40" fill="#0f172a" stroke="#1e293b"/>
    <rect x="150" y="44" width="80" height="18" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  </g>

  <!-- Spec Badge Pill -->
  <g transform="translate(20, 24)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="90" y="21" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" fill="#0369a1" text-anchor="middle">DELL INSPIRON 15</text>
  </g>

  <g transform="translate(430, 24)">
    <rect x="0" y="0" width="150" height="32" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="75" y="21" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" fill="#065f46" text-anchor="middle">✓ VERIFIED STUDENT</text>
  </g>
</svg>
