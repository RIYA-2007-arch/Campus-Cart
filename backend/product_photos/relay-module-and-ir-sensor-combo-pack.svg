<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <filter id="shadowRelay" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="#ffffff"/>

  <!-- 2-Channel Relay Module -->
  <g filter="url(#shadowRelay)" transform="translate(70, 70)">
    <!-- Blue PCB -->
    <rect width="260" height="230" rx="10" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
    <!-- Corner mounting holes -->
    <circle cx="15" cy="15" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="245" cy="15" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="15" cy="215" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="245" cy="215" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Green Screw Terminals (Output side) -->
    <rect x="18" y="35" width="60" height="42" rx="4" fill="#15803d" stroke="#166534" stroke-width="1"/>
    <circle cx="32" cy="56" r="5" fill="#cbd5e1" stroke="#334155"/><circle cx="64" cy="56" r="5" fill="#cbd5e1" stroke="#334155"/>

    <rect x="18" y="145" width="60" height="42" rx="4" fill="#15803d" stroke="#166534" stroke-width="1"/>
    <circle cx="32" cy="166" r="5" fill="#cbd5e1" stroke="#334155"/><circle cx="64" cy="166" r="5" fill="#cbd5e1" stroke="#334155"/>

    <!-- Dual Blue Songle Relays -->
    <rect x="95" y="30" width="110" height="75" rx="4" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5"/>
    <text x="150" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">SONGLE</text>
    <text x="150" y="75" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#bfdbfe" text-anchor="middle">10A 250VAC • 5V DC</text>
    <text x="150" y="88" font-family="monospace" font-size="6" fill="#93c5fd" text-anchor="middle">SRD-05VDC-SL-C</text>

    <rect x="95" y="125" width="110" height="75" rx="4" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5"/>
    <text x="150" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">SONGLE</text>
    <text x="150" y="170" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#bfdbfe" text-anchor="middle">10A 250VAC • 5V DC</text>
    <text x="150" y="183" font-family="monospace" font-size="6" fill="#93c5fd" text-anchor="middle">SRD-05VDC-SL-C</text>

    <!-- Input Header Pins -->
    <rect x="220" y="80" width="16" height="70" rx="2" fill="#1e293b"/>
    <circle cx="228" cy="95" r="2.5" fill="#eab308"/><circle cx="228" cy="115" r="2.5" fill="#eab308"/><circle cx="228" cy="135" r="2.5" fill="#eab308"/>

    <!-- Title on Relay PCB -->
    <text x="130" y="22" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">2-CHANNEL RELAY MODULE 5V</text>
  </g>

  <!-- IR Obstacle Avoidance Sensor 1 -->
  <g filter="url(#shadowRelay)" transform="translate(365, 70)">
    <rect width="165" height="105" rx="8" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <!-- IR Transmitter (Clear) and Receiver (Black) LEDs -->
    <rect x="15" y="-12" width="14" height="24" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect x="40" y="-12" width="14" height="24" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <!-- Sensitivity Trimmer Potentiometer (Blue) -->
    <rect x="80" y="25" width="28" height="28" rx="3" fill="#2563eb"/>
    <circle cx="94" cy="39" r="6" fill="#e2e8f0" stroke="#475569"/><line x1="91" y1="39" x2="97" y2="39" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Comparator IC -->
    <rect x="30" y="45" width="30" height="16" rx="2" fill="#1e293b"/>
    <text x="45" y="56" font-family="monospace" font-size="6" fill="#ffffff" text-anchor="middle">LM393</text>
    <!-- Header Pins -->
    <rect x="145" y="32" width="12" height="42" rx="2" fill="#1e293b"/>
    <text x="82" y="90" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">IR SENSOR MODULE 1</text>
  </g>

  <!-- IR Obstacle Avoidance Sensor 2 -->
  <g filter="url(#shadowRelay)" transform="translate(365, 195)">
    <rect width="165" height="105" rx="8" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <rect x="15" y="-12" width="14" height="24" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect x="40" y="-12" width="14" height="24" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="80" y="25" width="28" height="28" rx="3" fill="#2563eb"/>
    <circle cx="94" cy="39" r="6" fill="#e2e8f0" stroke="#475569"/><line x1="91" y1="39" x2="97" y2="39" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="30" y="45" width="30" height="16" rx="2" fill="#1e293b"/>
    <text x="45" y="56" font-family="monospace" font-size="6" fill="#ffffff" text-anchor="middle">LM393</text>
    <rect x="145" y="32" width="12" height="42" rx="2" fill="#1e293b"/>
    <text x="82" y="90" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">IR SENSOR MODULE 2</text>
  </g>

  <!-- Lower Details Banner -->
  <g filter="url(#shadowRelay)" transform="translate(70, 330)">
    <rect width="460" height="200" rx="16" fill="#0f172a"/>
    <text x="230" y="38" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle">RELAY &amp; IR OBSTACLE SENSOR PACK</text>
    <text x="230" y="62" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Complete Automation, Smart Car &amp; Obstacle Detection Combo</text>

    <!-- Specs List Grid -->
    <g transform="translate(30, 85)" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      <rect width="185" height="40" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="92" y="25" fill="#38bdf8" text-anchor="middle">✓ Optocoupler Isolated Relays</text>

      <rect x="215" width="185" height="40" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="307" y="25" fill="#38bdf8" text-anchor="middle">✓ Adjustable IR Detection (2-30cm)</text>

      <rect y="50" width="400" height="40" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="200" y="75" fill="#f8fafc" text-anchor="middle">🔌 5V Compatible with Arduino, ESP32, 8051 &amp; Raspberry Pi</text>
    </g>
  </g>
</svg>