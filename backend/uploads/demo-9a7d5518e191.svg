<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background studio glow -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>

    <!-- Metallic Silver Fridge Body Gradient -->
    <linearGradient id="fridge-body-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="8%" stop-color="#cbd5e1"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="90%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Door Bevel Gradient -->
    <linearGradient id="door-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Recessed Pocket Handle Gradient -->
    <linearGradient id="handle-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Star Rating Sticker Gradient -->
    <linearGradient id="star-sticker-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Soft Floor Shadow -->
    <radialGradient id="floor-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.28)"/>
      <stop offset="60%" stop-color="rgba(15, 23, 42, 0.08)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)"/>
    </radialGradient>

    <!-- Filter for soft realistic drop shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Clean Studio White Background -->
  <rect width="800" height="800" fill="url(#bg-glow)"/>

  <!-- Floor Shadow Under Refrigerator -->
  <ellipse cx="400" cy="710" rx="230" ry="28" fill="url(#floor-shadow)"/>

  <!-- Main Refrigerator Unit -->
  <g filter="url(#shadow)">
    <!-- Leveling Feet (Front & Rear Legs) -->
    <rect x="235" y="668" width="34" height="18" rx="4" fill="#1e293b"/>
    <rect x="239" y="684" width="26" height="8" rx="2" fill="#0f172a"/>
    <rect x="531" y="668" width="34" height="18" rx="4" fill="#1e293b"/>
    <rect x="535" y="684" width="26" height="8" rx="2" fill="#0f172a"/>

    <!-- Refrigerator Outer Cabinet (Metallic Sides & Top) -->
    <rect x="210" y="140" width="380" height="535" rx="24" fill="url(#fridge-body-grad)"/>

    <!-- Cabinet Top Bevel & Vent Edge -->
    <path d="M 215 158 Q 400 148 585 158 L 585 148 Q 400 138 215 148 Z" fill="#64748b" opacity="0.4"/>

    <!-- Main Front Door Panel -->
    <rect x="218" y="152" width="364" height="515" rx="18" fill="url(#door-grad)"/>

    <!-- Door Highlight Line (Left Side Curved Reflection) -->
    <path d="M 226 166 L 226 652" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- Door Edge Specular Reflection (Curved metallic finish) -->
    <path d="M 238 168 Q 242 410 238 650" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round"/>

    <!-- Door Gap / Seal Shadow at Bottom and Hinge Edge -->
    <path d="M 224 662 L 576 662" stroke="#64748b" stroke-width="2" opacity="0.5"/>
    <path d="M 576 160 L 576 660" stroke="#64748b" stroke-width="1.5" opacity="0.4"/>

    <!-- Recessed Top Pocket Handle (Modern compact design) -->
    <g transform="translate(480, 168)">
      <rect x="0" y="0" width="85" height="18" rx="6" fill="#334155"/>
      <rect x="3" y="3" width="79" height="12" rx="4" fill="url(#handle-grad)"/>
      <rect x="6" y="11" width="73" height="3" rx="1.5" fill="#1e293b"/>
    </g>

    <!-- Side Grip Handle Line (Alternative Grip) -->
    <rect x="566" y="240" width="6" height="70" rx="3" fill="#64748b" opacity="0.4"/>

    <!-- Brand Emblem (Sleek Minimal Badge) -->
    <g transform="translate(365, 178)">
      <rect x="0" y="0" width="70" height="14" rx="3" fill="#334155"/>
      <text x="35" y="10.5" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="900" fill="#f8fafc" letter-spacing="2.5" text-anchor="middle">COOLPRO</text>
    </g>

    <!-- Capacity & Model Badge -->
    <g transform="translate(365, 196)">
      <text x="35" y="8" font-family="Arial, Helvetica, sans-serif" font-size="7.5" font-weight="700" fill="#64748b" letter-spacing="1" text-anchor="middle">90L COMPACT</text>
    </g>

    <!-- BEE Star Energy Rating Label (Authentic Indian Appliance Feature) -->
    <g transform="translate(245, 185)">
      <!-- Label Base -->
      <rect x="0" y="0" width="58" height="76" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="2" y="2" width="54" height="20" rx="3" fill="url(#star-sticker-grad)"/>
      <text x="29" y="14" font-family="Arial, sans-serif" font-size="6.5" font-weight="900" fill="#ffffff" text-anchor="middle">MORE STARS</text>
      <text x="29" y="20" font-family="Arial, sans-serif" font-size="5" font-weight="700" fill="#ffffff" text-anchor="middle">MORE SAVINGS</text>

      <!-- 4 Star Graphics -->
      <g fill="#eab308" transform="translate(5, 25)">
        <polygon points="6,0 7.8,4.5 12.6,4.5 8.7,7.2 10.2,11.7 6,9 1.8,11.7 3.3,7.2 -0.6,4.5 4.2,4.5"/>
        <polygon points="18,0 19.8,4.5 24.6,4.5 20.7,7.2 22.2,11.7 18,9 13.8,11.7 15.3,7.2 11.4,4.5 16.2,4.5"/>
        <polygon points="30,0 31.8,4.5 36.6,4.5 32.7,7.2 34.2,11.7 30,9 25.8,11.7 27.3,7.2 23.4,4.5 28.2,4.5"/>
        <polygon points="42,0 43.8,4.5 48.6,4.5 44.7,7.2 46.2,11.7 42,9 37.8,11.7 39.3,7.2 35.4,4.5 40.2,4.5"/>
      </g>

      <!-- Power Savings Text -->
      <rect x="4" y="42" width="50" height="14" rx="2" fill="#ecfdf5"/>
      <text x="29" y="52" font-family="Arial, sans-serif" font-size="6" font-weight="800" fill="#047857" text-anchor="middle">108 kWh/YR</text>

      <text x="29" y="64" font-family="Arial, sans-serif" font-size="4.5" font-weight="700" fill="#475569" text-anchor="middle">INVERTER TECH</text>
      <text x="29" y="70" font-family="Arial, sans-serif" font-size="4" font-weight="600" fill="#94a3b8" text-anchor="middle">BEE / 2024</text>
    </g>

    <!-- Authentic Student Second-Hand / Hostel Verification Sticker -->
    <g transform="translate(245, 570)">
      <rect x="0" y="0" width="80" height="42" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3,1"/>
      <text x="40" y="14" font-family="Arial, sans-serif" font-size="7" font-weight="800" fill="#b45309" text-anchor="middle">✓ CAMPUS TESTED</text>
      <text x="40" y="25" font-family="Arial, sans-serif" font-size="6" font-weight="700" fill="#78350f" text-anchor="middle">Chiller &amp; Thermostat OK</text>
      <text x="40" y="34" font-family="Arial, sans-serif" font-size="5.5" font-weight="600" fill="#92400e" text-anchor="middle">Hostel Room Compliant</text>
    </g>

    <!-- Refrigerator Internal Capacity Cutout / Phantom View Diagram Overlay -->
    <!-- Illustrates that it is a 90L mini fridge with freezer box, bottle rack, wire shelves -->
    <g transform="translate(360, 240)" opacity="0.85">
      <!-- Dotted Outline of Chiller / Freezer Box -->
      <rect x="0" y="0" width="190" height="58" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,2"/>
      <text x="14" y="24" font-family="Arial, sans-serif" font-size="8.5" font-weight="800" fill="#0284c7">❄️ ICE CHILLER BOX</text>
      <text x="14" y="38" font-family="Arial, sans-serif" font-size="7" font-weight="600" fill="#0369a1">Freezer Tray + Ice Cubes Slot</text>

      <!-- Thermostat Control Knob Indicator -->
      <circle cx="165" cy="28" r="12" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="165" cy="28" r="4" fill="#0284c7"/>
      <text x="165" y="47" font-family="Arial, sans-serif" font-size="5" font-weight="700" fill="#0369a1" text-anchor="middle">TEMP 1-5</text>

      <!-- Middle Shelf (Tempered Glass / Wire Shelf) -->
      <line x1="0" y1="88" x2="190" y2="88" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <text x="14" y="80" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#0284c7">MAIN COOLING SHELF</text>

      <!-- Lower Shelf & Vegetable / Snack Crisper Box -->
      <line x1="0" y1="160" x2="190" y2="160" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <rect x="0" y="166" width="190" height="60" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,2"/>
      <text x="14" y="195" font-family="Arial, sans-serif" font-size="7.5" font-weight="700" fill="#0284c7">FRUIT &amp; CRISPER BASKET</text>

      <!-- Door 2L Bottle Balcony Silhouette -->
      <rect x="120" y="235" width="70" height="42" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <text x="155" y="258" font-family="Arial, sans-serif" font-size="6.5" font-weight="700" fill="#15803d" text-anchor="middle">2L BOTTLE RACK</text>
    </g>

    <!-- Subtle Metallic Door Reflection Highlight Bar -->
    <path d="M 270 170 L 320 170 L 300 645 L 250 645 Z" fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- Product Specifications Overlay Tag (Modern & Professional) -->
  <g transform="translate(400, 755)">
    <rect x="-190" y="-18" width="380" height="34" rx="17" fill="#0f172a"/>
    <text x="0" y="4" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
      MINI REFRIGERATOR (90L) • SINGLE DOOR • CHILLER
    </text>
  </g>
</svg>
