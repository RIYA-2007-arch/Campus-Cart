<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <filter id="shadow82" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="bodyGrad82" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Pure White Background -->
  <rect width="600" height="600" fill="#ffffff"/>

  <!-- Calculator Body (Curved Classic Ergonomic Shape) -->
  <g filter="url(#shadow82)">
    <rect x="156" y="32" width="288" height="536" rx="34" fill="#0f172a"/>
    <rect x="160" y="35" width="280" height="530" rx="32" fill="url(#bodyGrad82)"/>
    <rect x="164" y="39" width="272" height="522" rx="28" fill="none" stroke="#475569" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Solid Header (NO solar panel - battery powered!) -->
  <text x="190" y="66" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" fill="#f8fafc" letter-spacing="1">CASIO</text>
  <text x="190" y="83" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">fx-82MS</text>
  <text x="255" y="83" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="900" fill="#ffffff">S-V.P.A.M.</text>
  <text x="190" y="94" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" fill="#38bdf8">2-LINE DISPLAY • 240 FUNCTIONS</text>

  <!-- Retro 2-Line Green-Grey LCD Display -->
  <g transform="translate(180, 100)">
    <rect width="240" height="88" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Classic Retro LCD Screen -->
    <rect x="8" y="8" width="224" height="72" rx="4" fill="#9cb399"/>
    <polygon points="8,8 140,8 90,80 8,80" fill="#ffffff" opacity="0.12"/>

    <!-- Top Dot-Matrix Calculation Line -->
    <text x="16" y="28" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#1e293b">sin(45) + cos(30)</text>
    <!-- Bottom 7-Segment Result Line -->
    <text x="218" y="70" font-family="'Courier New', monospace" font-size="22" font-weight="900" fill="#0f172a" text-anchor="end">1.573132185</text>
  </g>

  <!-- Classic Oval Replay Rocker (Wide Oval Cursor) -->
  <g transform="translate(300, 222)">
    <rect x="-30" y="-18" width="60" height="36" rx="18" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="0" y="3" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#94a3b8" text-anchor="middle">REPLAY</text>
    <polygon points="0,-13 -4,-8 4,-8" fill="#38bdf8"/>
    <polygon points="0,13 -4,8 4,8" fill="#38bdf8"/>
    <polygon points="-24,0 -19,-4 -19,4" fill="#38bdf8"/>
    <polygon points="24,0 19,-4 19,4" fill="#38bdf8"/>
  </g>

  <!-- Top Function Keys -->
  <rect x="180" y="200" width="30" height="18" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="195" y="196" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#eab308" text-anchor="middle">SHIFT</text>
  <rect x="220" y="200" width="30" height="18" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="235" y="196" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#ef4444" text-anchor="middle">ALPHA</text>
  <rect x="350" y="200" width="30" height="18" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="365" y="196" font-family="Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#94a3b8" text-anchor="middle">MODE</text>
  <rect x="390" y="200" width="30" height="18" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="405" y="196" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#f8fafc" text-anchor="middle">ON</text>

  <!-- Science Rows (Oval/Pill Buttons with Blue Accent) -->
  <g fill="#1e3a5f" stroke="#0f2942" stroke-width="1" font-family="Arial, sans-serif" font-size="8" font-weight="bold">
    <rect x="180" y="228" width="34" height="16" rx="5"/><text x="197" y="239" fill="#ffffff" text-anchor="middle">d/c</text>
    <rect x="222" y="228" width="34" height="16" rx="5"/><text x="239" y="239" fill="#ffffff" text-anchor="middle">√■</text>
    <rect x="264" y="228" width="34" height="16" rx="5"/><text x="281" y="239" fill="#ffffff" text-anchor="middle">x²</text>
    <rect x="306" y="228" width="34" height="16" rx="5"/><text x="323" y="239" fill="#ffffff" text-anchor="middle">^</text>
    <rect x="348" y="228" width="34" height="16" rx="5"/><text x="365" y="239" fill="#ffffff" text-anchor="middle">log</text>
    <rect x="390" y="228" width="34" height="16" rx="5"/><text x="407" y="239" fill="#ffffff" text-anchor="middle">ln</text>

    <!-- Row 2 -->
    <rect x="180" y="252" width="34" height="16" rx="5"/><text x="197" y="263" fill="#ffffff" text-anchor="middle">(-)</text>
    <rect x="222" y="252" width="34" height="16" rx="5"/><text x="239" y="263" fill="#ffffff" text-anchor="middle">°' ''</text>
    <rect x="264" y="252" width="34" height="16" rx="5"/><text x="281" y="263" fill="#ffffff" text-anchor="middle">hyp</text>
    <rect x="306" y="252" width="34" height="16" rx="5"/><text x="323" y="263" fill="#ffffff" text-anchor="middle">sin</text>
    <rect x="348" y="252" width="34" height="16" rx="5"/><text x="365" y="263" fill="#ffffff" text-anchor="middle">cos</text>
    <rect x="390" y="252" width="34" height="16" rx="5"/><text x="407" y="263" fill="#ffffff" text-anchor="middle">tan</text>

    <!-- Row 3 -->
    <rect x="180" y="276" width="34" height="16" rx="5"/><text x="197" y="287" fill="#ffffff" text-anchor="middle">RCL</text>
    <rect x="222" y="276" width="34" height="16" rx="5"/><text x="239" y="287" fill="#ffffff" text-anchor="middle">ENG</text>
    <rect x="264" y="276" width="34" height="16" rx="5"/><text x="281" y="287" fill="#ffffff" text-anchor="middle">(</text>
    <rect x="306" y="276" width="34" height="16" rx="5"/><text x="323" y="287" fill="#ffffff" text-anchor="middle">)</text>
    <rect x="348" y="276" width="34" height="16" rx="5"/><text x="365" y="287" fill="#ffffff" text-anchor="middle">,</text>
    <rect x="390" y="276" width="34" height="16" rx="5"/><text x="407" y="287" fill="#ffffff" text-anchor="middle">M+</text>
  </g>

  <!-- Number Keypad in Classic Light Grey with Distinctive Dark Casing -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <!-- Row 1: 7, 8, 9, DEL, AC -->
    <rect x="180" y="335" width="42" height="34" rx="7" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/><text x="201" y="357" font-size="16" fill="#0f172a" text-anchor="middle">7</text>
    <rect x="230" y="335" width="42" height="34" rx="7" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/><text x="251" y="357" font-size="16" fill="#0f172a" text-anchor="middle">8</text>
    <rect x="280" y="335" width="42" height="34" rx="7" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/><text x="301" y="357" font-size="16" fill="#0f172a" text-anchor="middle">9</text>
    <rect x="330" y="335" width="42" height="34" rx="7" fill="#d97706" stroke="#b45309" stroke-width="1.5"/><text x="351" y="356" font-size="12" fill="#ffffff" text-anchor="middle">DEL</text>
    <rect x="380" y="335" width="42" height="34" rx="7" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/><text x="401" y="356" font-size="12" fill="#ffffff" text-anchor="middle">AC</text>

    <!-- Row 2: 4, 5, 6, ×, ÷ -->
    <rect x="180" y="380" width="42" height="34" rx="7" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/><text x="201" y="402" font-size="16" fill="#0f172a" text-anchor="middle">4</text>
    <rect x="230" y="380" width="42" height="34" rx="7" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/><text x="251" y="402" font-size="16" fill="#0f172a" text-anchor="middle">5</text>
    <rect x="280" y="380" width="42" height="34" rx="7" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/><text x="301" y="402" font-size="16" fill="#0f172a" text-anchor="middle">6</text>
    <rect x="330" y="380" width="42" height="34" rx="7" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/><text x="351" y="402" font-size="17" fill="#0f172a" text-anchor="middle">×</text>
    <rect x="380" y="380" width="42" height="34" rx="7" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/><text x="401" y="402" font-size="17" fill="#0f172a" text-anchor="middle">÷</text>

    <!-- Row 3: 1, 2, 3, +, - -->
    <rect x="180" y="425" width="42" height="34" rx="7" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/><text x="201" y="447" font-size="16" fill="#0f172a" text-anchor="middle">1</text>
    <rect x="230" y="425" width="42" height="34" rx="7" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/><text x="251" y="447" font-size="16" fill="#0f172a" text-anchor="middle">2</text>
    <rect x="280" y="425" width="42" height="34" rx="7" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/><text x="301" y="447" font-size="16" fill="#0f172a" text-anchor="middle">3</text>
    <rect x="330" y="425" width="42" height="34" rx="7" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/><text x="351" y="447" font-size="17" fill="#0f172a" text-anchor="middle">+</text>
    <rect x="380" y="425" width="42" height="34" rx="7" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/><text x="401" y="447" font-size="17" fill="#0f172a" text-anchor="middle">-</text>

    <!-- Row 4: 0, ., EXP, Ans, = -->
    <rect x="180" y="470" width="42" height="34" rx="7" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/><text x="201" y="492" font-size="16" fill="#0f172a" text-anchor="middle">0</text>
    <rect x="230" y="470" width="42" height="34" rx="7" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/><text x="251" y="492" font-size="18" fill="#0f172a" text-anchor="middle">•</text>
    <rect x="280" y="470" width="42" height="34" rx="7" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/><text x="301" y="491" font-size="11" fill="#0f172a" text-anchor="middle">EXP</text>
    <rect x="330" y="470" width="42" height="34" rx="7" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/><text x="351" y="491" font-size="11" fill="#0f172a" text-anchor="middle">Ans</text>
    <rect x="380" y="470" width="42" height="34" rx="7" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/><text x="401" y="493" font-size="18" fill="#0f172a" text-anchor="middle">=</text>
  </g>
</svg>