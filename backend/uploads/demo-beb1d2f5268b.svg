<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <filter id="shadowBag" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="heatherGrey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="#ffffff"/>

  <!-- Shoulder Strap Arch Behind Bag -->
  <path d="M 120 200 C 120 30, 480 30, 480 200" fill="none" stroke="#0f172a" stroke-width="22" stroke-linecap="round"/>
  <!-- Padded Shoulder Pad -->
  <path d="M 230 46 C 265 42, 335 42, 370 46" fill="none" stroke="#334155" stroke-width="34" stroke-linecap="round"/>
  <path d="M 235 46 C 265 42, 335 42, 365 46" fill="none" stroke="#475569" stroke-width="30" stroke-linecap="round"/>

  <!-- Main Bag Body with Soft Ground Shadow -->
  <g filter="url(#shadowBag)" transform="translate(65, 120)">
    <!-- Top Carry Handles -->
    <path d="M 170 30 C 170 -30, 300 -30, 300 30" fill="none" stroke="#0f172a" stroke-width="18" stroke-linecap="round"/>
    <path d="M 195 -12 L 275 -12" stroke="#334155" stroke-width="22" stroke-linecap="round"/>

    <!-- Main Briefcase Chassis (15.6 Inch Compartment) -->
    <rect width="470" height="350" rx="20" fill="url(#heatherGrey)" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Outer Piping Reinforcement -->
    <rect x="8" y="8" width="454" height="334" rx="16" fill="none" stroke="#64748b" stroke-width="2" opacity="0.5"/>

    <!-- Bottom Wear-Resistant Rubber Pads -->
    <rect x="40" y="344" width="60" height="10" rx="3" fill="#0f172a"/>
    <rect x="370" y="344" width="60" height="10" rx="3" fill="#0f172a"/>

    <!-- Main Zipper Top Track -->
    <rect x="30" y="18" width="410" height="14" rx="3" fill="#0f172a"/>
    <!-- Double Chrome Zipper Pullers -->
    <rect x="220" y="15" width="12" height="20" rx="2" fill="#cbd5e1" stroke="#475569"/>
    <rect x="238" y="15" width="12" height="20" rx="2" fill="#cbd5e1" stroke="#475569"/>

    <!-- Front Quick-Access Zipper Compartment -->
    <rect x="30" y="80" width="410" height="235" rx="14" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <rect x="35" y="85" width="400" height="40" rx="6" fill="#334155" stroke="#475569" stroke-width="1"/>
    <!-- Horizontal Front Zipper Line -->
    <line x1="45" y1="105" x2="385" y2="105" stroke="#0f172a" stroke-width="4"/>
    <!-- Chrome Zipper Pull -->
    <rect x="340" y="98" width="22" height="14" rx="2" fill="#cbd5e1" stroke="#334155"/>

    <!-- Front Accessory Organizer Pouch (Mouse & Charger Pocket) -->
    <rect x="50" y="145" width="170" height="145" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="135" y="215" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#64748b" text-anchor="middle">CHARGER &amp; MOUSE</text>
    <text x="135" y="235" font-family="Arial, sans-serif" font-size="8" fill="#475569" text-anchor="middle">ORGANIZER POCKET</text>

    <!-- Side Pen / Document Slots -->
    <rect x="245" y="145" width="175" height="145" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="332" y="215" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#64748b" text-anchor="middle">TABLET &amp; NOTEBOOK</text>
    <text x="332" y="235" font-family="Arial, sans-serif" font-size="8" fill="#475569" text-anchor="middle">QUICK-ACCESS SLEEVE</text>

    <!-- Metal Swivel Carabiner Shoulder Clips on Left & Right -->
    <g fill="#cbd5e1" stroke="#334155" stroke-width="1.5">
      <circle cx="10" cy="90" r="12"/>
      <circle cx="10" cy="90" r="6" fill="#1e293b"/>
      <circle cx="460" cy="90" r="12"/>
      <circle cx="460" cy="90" r="6" fill="#1e293b"/>
    </g>

    <!-- Professional Rubberized Brand Tag -->
    <g transform="translate(185, 305)">
      <rect width="100" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="50" y="16" font-family="Arial, sans-serif" font-size="8.5" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1">15.6" PADDED</text>
    </g>
  </g>
</svg>