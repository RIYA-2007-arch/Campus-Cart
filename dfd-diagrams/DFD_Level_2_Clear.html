<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #ffffff; overflow: hidden; }
    svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" width="1040" height="700">
  <defs>
    <style>
      * { font-family: 'Segoe UI', Arial, sans-serif; }
      .bg { fill: #ffffff; }
      .border-box { stroke: #0f172a; stroke-width: 2.2; fill: none; }
      
      /* Entities */
      .ent-rect { fill: #f8fafc; stroke: #0f172a; stroke-width: 2.2; rx: 6; ry: 6; }
      .ent-head { fill: #e2e8f0; stroke: #0f172a; stroke-width: 2; }
      .ent-title { font-size: 15px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .ent-sub { font-size: 12px; fill: #334155; text-anchor: middle; font-weight: 500; }
      
      /* Processes */
      .proc-box { fill: #ffffff; stroke: #0f172a; stroke-width: 2.4; rx: 16; ry: 16; }
      .proc-head { fill: #f1f5f9; stroke: #0f172a; stroke-width: 2; }
      .proc-id { font-size: 14px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .proc-name { font-size: 14px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .proc-desc { font-size: 12px; fill: #475569; text-anchor: middle; }

      /* Data Stores */
      .store-line { stroke: #0f172a; stroke-width: 2.2; }
      .store-id-bg { fill: #e2e8f0; stroke: #0f172a; stroke-width: 1.8; }
      .store-id-txt { font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; font-family: monospace; }
      .store-name-txt { font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: start; }

      /* Arrows & Labels */
      .arrow-line { stroke: #0f172a; stroke-width: 2.2; fill: none; }
      .lbl-box { fill: #ffffff; stroke: #64748b; stroke-width: 1; rx: 4; ry: 4; }
      .lbl-txt { font-size: 12.5px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1040" height="700" class="bg"/>

  <!-- Outer Formal Border -->
  <rect x="15" y="15" width="1010" height="670" class="border-box"/>
  <rect x="20" y="20" width="1000" height="660" stroke="#94a3b8" stroke-width="0.8" fill="none"/>

  <!-- Header Banner -->
  <rect x="30" y="30" width="980" height="55" fill="#f8fafc" stroke="#0f172a" stroke-width="1.8" rx="4"/>
  <text x="520" y="55" font-size="18px" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="0.5px">CAMPUSCART — LEVEL 2 — ORDER & HANDOVER OTP DECOMPOSITION</text>
  <text x="520" y="74" font-size="12.5px" fill="#475569" text-anchor="middle">Sub-Process Flow: In-Memory UPI QR Generation & Secure OTP Handover</text>

  <!-- Diagram Content -->
  
  <!-- ENTITIES -->
  <!-- Buyer -->
  <g id="ent-b2">
    <rect x="40" y="230" width="130" height="180" class="ent-rect"/>
    <rect x="40" y="230" width="130" height="32" rx="6" ry="6" class="ent-head"/>
    <line x1="40" y1="262" x2="170" y2="262" stroke="#0f172a" stroke-width="1.5"/>
    <text x="105" y="252" class="ent-title">BUYER</text>
    <text x="105" y="285" class="ent-sub">1. Select Product</text>
    <text x="105" y="315" class="ent-sub">2. Scan UPI QR</text>
    <text x="105" y="345" class="ent-sub">3. Inspect Goods</text>
    <text x="105" y="375" class="ent-sub">4. Share OTP</text>
  </g>

  <!-- Seller -->
  <g id="ent-s2">
    <rect x="870" y="230" width="130" height="180" class="ent-rect"/>
    <rect x="870" y="230" width="130" height="32" rx="6" ry="6" class="ent-head"/>
    <line x1="870" y1="262" x2="1000" y2="262" stroke="#0f172a" stroke-width="1.5"/>
    <text x="935" y="252" class="ent-title">SELLER</text>
    <text x="935" y="285" class="ent-sub">1. Receive Alert</text>
    <text x="935" y="315" class="ent-sub">2. Campus Meetup</text>
    <text x="935" y="345" class="ent-sub">3. Take Buyer OTP</text>
    <text x="935" y="375" class="ent-sub">4. Complete Sale</text>
  </g>

  <!-- SUB-PROCESSES (LEFT: 4.x ORDER PLACEMENT) -->
  
    <g id="p41">
      <rect x="230" y="140" width="190" height="65" class="proc-box"/>
      <rect x="230" y="140" width="190" height="22" rx="14" ry="14" class="proc-head"/>
      <rect x="230" y="151" width="190" height="11" fill="#f1f5f9" stroke="none"/>
      <line x1="230" y1="162" x2="420" y2="162" stroke="#0f172a" stroke-width="1.8"/>
      <text x="325" y="156" class="proc-id">4.1</text>
      <text x="325" y="185" class="proc-name" font-size="12.5px">Check Availability</text>
    </g>
  
    <g id="p42">
      <rect x="230" y="275" width="190" height="65" class="proc-box"/>
      <rect x="230" y="275" width="190" height="22" rx="14" ry="14" class="proc-head"/>
      <rect x="230" y="286" width="190" height="11" fill="#f1f5f9" stroke="none"/>
      <line x1="230" y1="297" x2="420" y2="297" stroke="#0f172a" stroke-width="1.8"/>
      <text x="325" y="291" class="proc-id">4.2</text>
      <text x="325" y="320" class="proc-name" font-size="12.5px">Generate Dynamic UPI QR</text>
    </g>
  
    <g id="p43">
      <rect x="230" y="410" width="190" height="65" class="proc-box"/>
      <rect x="230" y="410" width="190" height="22" rx="14" ry="14" class="proc-head"/>
      <rect x="230" y="421" width="190" height="11" fill="#f1f5f9" stroke="none"/>
      <line x1="230" y1="432" x2="420" y2="432" stroke="#0f172a" stroke-width="1.8"/>
      <text x="325" y="426" class="proc-id">4.3</text>
      <text x="325" y="455" class="proc-name" font-size="12.5px">Generate 6-Digit OTP</text>
    </g>

  <!-- SUB-PROCESSES (RIGHT: 5.x HANDOVER OTP) -->
  
    <g id="p51">
      <rect x="650" y="275" width="190" height="65" class="proc-box"/>
      <rect x="650" y="275" width="190" height="22" rx="14" ry="14" class="proc-head"/>
      <rect x="650" y="286" width="190" height="11" fill="#f1f5f9" stroke="none"/>
      <line x1="650" y1="297" x2="840" y2="297" stroke="#0f172a" stroke-width="1.8"/>
      <text x="745" y="291" class="proc-id">5.1</text>
      <text x="745" y="320" class="proc-name" font-size="12.5px">Receive Meetup OTP</text>
    </g>
  
    <g id="p52">
      <rect x="650" y="410" width="190" height="65" class="proc-box"/>
      <rect x="650" y="410" width="190" height="22" rx="14" ry="14" class="proc-head"/>
      <rect x="650" y="421" width="190" height="11" fill="#f1f5f9" stroke="none"/>
      <line x1="650" y1="432" x2="840" y2="432" stroke="#0f172a" stroke-width="1.8"/>
      <text x="745" y="426" class="proc-id">5.2</text>
      <text x="745" y="455" class="proc-name" font-size="12.5px">Verify Cryptographic OTP</text>
    </g>
  
    <g id="p53">
      <rect x="650" y="545" width="190" height="65" class="proc-box"/>
      <rect x="650" y="545" width="190" height="22" rx="14" ry="14" class="proc-head"/>
      <rect x="650" y="556" width="190" height="11" fill="#f1f5f9" stroke="none"/>
      <line x1="650" y1="567" x2="840" y2="567" stroke="#0f172a" stroke-width="1.8"/>
      <text x="745" y="561" class="proc-id">5.3</text>
      <text x="745" y="590" class="proc-name" font-size="12.5px">Atomic State: SOLD</text>
    </g>

  <!-- DATA STORES (CENTER) -->
  
    <g id="st-p">
      <line x1="450" y1="152" x2="630" y2="152" class="store-line"/>
      <line x1="450" y1="192" x2="630" y2="192" class="store-line"/>
      <rect x="450" y="152" width="40" height="40" class="store-id-bg"/>
      <text x="470" y="177" class="store-id-txt">D2</text>
      <rect x="490" y="153" width="140" height="38" fill="#ffffff"/>
      <text x="500" y="177" class="store-name-txt">Products Store</text>
    </g>
  
    <g id="st-o">
      <line x1="450" y1="287" x2="630" y2="287" class="store-line"/>
      <line x1="450" y1="327" x2="630" y2="327" class="store-line"/>
      <rect x="450" y="287" width="40" height="40" class="store-id-bg"/>
      <text x="470" y="312" class="store-id-txt">D3</text>
      <rect x="490" y="288" width="140" height="38" fill="#ffffff"/>
      <text x="500" y="312" class="store-name-txt">Orders Store</text>
    </g>
  
    <g id="st-h">
      <line x1="450" y1="422" x2="630" y2="422" class="store-line"/>
      <line x1="450" y1="462" x2="630" y2="462" class="store-line"/>
      <rect x="450" y="422" width="40" height="40" class="store-id-bg"/>
      <text x="470" y="447" class="store-id-txt">D4</text>
      <rect x="490" y="423" width="140" height="38" fill="#ffffff"/>
      <text x="500" y="447" class="store-name-txt">Handover OTPs</text>
    </g>

  <!-- ARROWS & FLOWS -->
  <!-- Buyer -> 4.1 -->
  <path d="M 170 240 L 230 175" class="arrow-line" marker-end="url(#arr)"/>
  <rect x="175" y="195" width="60" height="24" class="lbl-box"/>
  <text x="205" y="212" class="lbl-txt">Select</text>

  <!-- 4.1 <-> D2 -->
  <path d="M 420 172 L 450 172" class="arrow-line" marker-end="url(#arr)"/>

  <!-- 4.1 -> 4.2 -->
  <path d="M 325 205 L 325 275" class="arrow-line" marker-end="url(#arr)"/>
  <rect x="290" y="230" width="70" height="24" class="lbl-box"/>
  <text x="325" y="247" class="lbl-txt">Available</text>

  <!-- 4.2 -> D3 -->
  <path d="M 420 307 L 450 307" class="arrow-line" marker-end="url(#arr)"/>

  <!-- 4.2 -> Buyer (UPI QR) -->
  <path d="M 230 310 L 170 310" class="arrow-line" marker-end="url(#arr)"/>
  <rect x="175" y="298" width="50" height="24" class="lbl-box"/>
  <text x="200" y="315" class="lbl-txt">UPI QR</text>

  <!-- 4.2 -> 4.3 -->
  <path d="M 325 340 L 325 410" class="arrow-line" marker-end="url(#arr)"/>

  <!-- 4.3 -> D4 OTPs -->
  <path d="M 420 442 L 450 442" class="arrow-line" marker-end="url(#arr)"/>

  <!-- 4.3 -> Buyer (6-Digit OTP) -->
  <path d="M 230 440 L 140 440 L 140 410" class="arrow-line" marker-end="url(#arr)"/>
  <rect x="150" y="428" width="75" height="24" class="lbl-box"/>
  <text x="187" y="445" class="lbl-txt">6-Digit OTP</text>

  <!-- Physical Meetup Visual Indicator -->
  <rect x="445" y="500" width="190" height="60" rx="8" ry="8" fill="#f8fafc" stroke="#475569" stroke-dasharray="4,3" stroke-width="1.5"/>
  <text x="540" y="525" font-size="12px" font-weight="bold" fill="#0f172a" text-anchor="middle">Physical Meetup</text>
  <text x="540" y="545" font-size="11px" fill="#475569" text-anchor="middle">Buyer shares OTP on delivery</text>

  <!-- Seller -> 5.1 Enter OTP -->
  <path d="M 870 310 L 840 310" class="arrow-line" marker-end="url(#arr)"/>
  <rect x="842" y="298" width="55" height="24" class="lbl-box"/>
  <text x="870" y="315" class="lbl-txt">Type OTP</text>

  <!-- 5.1 -> 5.2 -->
  <path d="M 745 340 L 745 410" class="arrow-line" marker-end="url(#arr)"/>

  <!-- 5.2 <-> D4 OTP -->
  <path d="M 650 442 L 630 442" class="arrow-line" marker-end="url(#arr)"/>

  <!-- 5.2 -> 5.3 -->
  <path d="M 745 475 L 745 545" class="arrow-line" marker-end="url(#arr)"/>
  <rect x="710" y="500" width="70" height="24" class="lbl-box"/>
  <text x="745" y="517" class="lbl-txt">OTP Valid</text>

  <!-- 5.3 -> D2 & D3 (Mark SOLD) -->
  <path d="M 650 577 L 540 577 L 540 327" class="arrow-line" marker-end="url(#arr)"/>
  <rect x="545" y="370" width="100" height="24" class="lbl-box"/>
  <text x="595" y="387" class="lbl-txt">Mark Item SOLD</text>

  <!-- 5.3 -> Seller (Sale Complete) -->
  <path d="M 840 577 L 935 577 L 935 410" class="arrow-line" marker-end="url(#arr)"/>
  <rect x="850" y="565" width="85" height="24" class="lbl-box"/>
  <text x="892" y="582" class="lbl-txt">Sale Success</text>
  

  <!-- Footer -->
  <rect x="30" y="655" width="980" height="30" fill="#f8fafc" stroke="#0f172a" stroke-width="1.2" rx="4"/>
  <text x="45" y="674" font-size="12px" font-weight="bold" fill="#0f172a">CampusCart Project Report</text>
  <text x="520" y="674" font-size="11.5px" fill="#475569" text-anchor="middle">Standard: Gane-Sarson / IEEE Academic Specification</text>
  <text x="995" y="674" font-size="12px" font-weight="bold" fill="#0f172a" text-anchor="end">Level 2 — Order & Handover OTP Decomposition</text>
</svg>
</body>
</html>
