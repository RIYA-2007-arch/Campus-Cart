<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 170" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-bright-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="25%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="gold-pillar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="gold-luminous-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#FACC15" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Classical Architectural Pavilion Mark (Golden/White Bright Glow) -->
  <g transform="translate(15, 8) scale(1.05)" filter="url(#gold-luminous-glow)">
    <!-- Pediment Roof / Triangular Dome Top -->
    <polygon points="80,24 130,48 30,48" fill="url(#gold-bright-grad)" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="26" y="50" width="108" height="6" rx="2" fill="#FFFFFF"/>
    
    <!-- Classical Fluted Pillars on sides -->
    <rect x="34" y="58" width="9" height="54" rx="2" fill="url(#gold-pillar-grad)" stroke="#FFFFFF" stroke-width="0.8"/>
    <rect x="117" y="58" width="9" height="54" rx="2" fill="url(#gold-pillar-grad)" stroke="#FFFFFF" stroke-width="0.8"/>
    
    <!-- Central Golden Cart in Negative Arch -->
    <path d="M52,72 L100,72 Q106,72 104,84 L101,98 Q99,104 91,104 L61,104 Q55,104 56,96 Z" 
          fill="none" stroke="url(#gold-bright-grad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="62" y1="86" x2="96" y2="86" stroke="#FFFFFF" stroke-width="2.5"/>
    
    <!-- Foundation Base Plinth -->
    <rect x="24" y="114" width="112" height="6" rx="2" fill="#FFFFFF"/>
    
    <!-- Golden Solid Wheels with Radiant Hubs -->
    <circle cx="66" cy="128" r="9.5" fill="url(#gold-bright-grad)" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="66" cy="128" r="4" fill="#FFFFFF"/>
    <circle cx="98" cy="128" r="9.5" fill="url(#gold-bright-grad)" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="98" cy="128" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Professional Typography (Bright Glowing White & Gold) -->
  <g transform="translate(180, 5)" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">
    <!-- Main Brand Name: Campus in pure crisp White with subtle drop shadow, Cart in Vibrant Neon Gold -->
    <text x="0" y="88" font-size="52" font-weight="900" letter-spacing="-1.5" fill="#FFFFFF">Campus<tspan fill="#FACC15" font-weight="900">Cart</tspan></text>
    
    <!-- Elegant Gold Divider Accent -->
    <rect x="0" y="106" width="56" height="4" rx="2" fill="#FACC15"/>
    
    <!-- Clean Professional Tagline -->
    <text x="68" y="110" font-size="12" font-weight="800" letter-spacing="3.5" fill="#FEF08A" text-transform="uppercase">VERIFIED STUDENT MARKETPLACE • AKS UNIVERSITY</text>
  </g>
</svg>