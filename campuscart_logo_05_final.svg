<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 170" width="100%" height="100%">
    <!-- Symbol / Mark (Enlarged) -->
    <g transform="translate(10, 5) scale(1.05)">
      
    <defs>
      <linearGradient id="final5-terra" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDBA74"/><stop offset="50%" stop-color="#EA580C"/><stop offset="100%" stop-color="#7C2D12"/>
      </linearGradient>
      <filter id="final5-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7C2D12" flood-opacity="0.25"/>
      </filter>
    </defs>
    <g filter="url(#final5-glow)">
      <!-- Tier 1: Amphitheater / Library Arch Top -->
      <path d="M52,48 C52,34 64,26 80,26 C96,26 108,34 108,48" fill="none" stroke="url(#final5-terra)" stroke-width="5.5" stroke-linecap="round"/>
      <!-- Tier 2: Colonnade Mid Arc -->
      <path d="M42,66 C42,54 58,45 80,45 C102,45 118,54 118,66" fill="none" stroke="url(#final5-terra)" stroke-width="5" stroke-linecap="round"/>
      <!-- Tier 3: Main Basket Bowl -->
      <path d="M36,84 C36,70 54,62 80,62 C106,62 124,70 124,84 L118,106 Q116,114 104,114 L56,114 Q44,114 42,106 Z" fill="url(#final5-terra)"/>
      <!-- Inner Architectural Slits in negative space -->
      <line x1="64" y1="88" x2="64" y2="104" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
      <line x1="80" y1="88" x2="80" y2="104" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
      <line x1="96" y1="88" x2="96" y2="104" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
      <!-- Heavy Classical Wheels with Sandstone Rivets -->
      <circle cx="64" cy="128" r="10" fill="#7C2D12"/>
      <circle cx="64" cy="128" r="4.5" fill="#FDBA74"/>
      <circle cx="104" cy="128" r="10" fill="#7C2D12"/>
      <circle cx="104" cy="128" r="4.5" fill="#FDBA74"/>
    </g>
  
    </g>
    <!-- Professional Typography -->
    <g transform="translate(180, 5)" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">
      <!-- Main Brand Name -->
      <text x="0" y="88" font-size="52" font-weight="900" letter-spacing="-2" fill="#1C1917">Campus<tspan fill="#EA580C" font-weight="900">Cart</tspan></text>
      <!-- Sleek Accent Bar -->
      <rect x="0" y="106" width="56" height="4" rx="2" fill="#EA580C"/>
      <!-- Clean Professional Subtitle -->
      <text x="68" y="110" font-size="12" font-weight="800" letter-spacing="3.5" fill="#9A3412" text-transform="uppercase">VERIFIED STUDENT MARKETPLACE • AKS UNIVERSITY</text>
    </g>
  </svg>