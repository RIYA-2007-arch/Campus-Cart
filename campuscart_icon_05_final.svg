      <!-- Inner Architectural Slits in negative space -->
      <line x1="64" y1="88" x2="64" y2="104" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
      <line x1="80" y1="88" x2="80" y2="104" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
      <line x1="96" y1="88" x2="96" y2="104" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
      <!-- Heavy Classical Wheels with Sandstone Rivets -->
      <circle cx="64" cy="128" r="10" fill="#7C2D12"/>
      <circle cx="64" cy="128" r="4.5" fill="#FDBA74"/>
      <circle cx="104" cy="128" r="10" fill="#7C2D12"/>
      <circle cx="104" cy="128" r="4.5" fill="#FDBA74"/>
