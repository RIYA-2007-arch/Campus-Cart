<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
    <rect width="160" height="160" rx="36" fill="#FFF7ED" stroke="#FDBA74" stroke-width="3"/>
    <g transform="translate(0, 0)">
      
    <defs>
      <linearGradient id="final5iconicon-terra" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDBA74"/><stop offset="50%" stop-color="#EA580C"/><stop offset="100%" stop-color="#7C2D12"/>
      </linearGradient>
      <filter id="final5iconicon-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7C2D12" flood-opacity="0.25"/>
      </filter>
    </defs>
    <g filter="url(#final5iconicon-glow)">
